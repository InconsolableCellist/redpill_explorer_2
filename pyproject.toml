[project]
name = "re2"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "httpx>=0.27",
  "pillow>=10",
  "numpy>=1.26",
  "tqdm>=4.66",
  "python-magic>=0.4.27",
  "imagehash>=4.3",
  "pymupdf>=1.24",
  "faster-whisper==1.2.1",
  "nvidia-cublas-cu12",
  "nvidia-cudnn-cu12",
  "umap-learn>=0.5.12",
  "scikit-learn>=1.9.1",
  "markdown-it-py>=4.2.0",
]

[project.scripts]
re2 = "re2.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["re2"]

[tool.uv]
python-preference = "managed"
