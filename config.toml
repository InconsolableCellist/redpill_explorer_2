[paths]
corpus_root = "/home/offipso/Downloads/redpills"   # RE2_CORPUS_ROOT, or [paths] in config.local.toml, overrides it
data_dir = "data"
legacy_dir = "legacy"
thumbs_dir = "public/thumbnails"
archive_metadata = "archive_metadata.json"        # relative: inside corpus_root
legacy_output_json = "output.json"

[llm]
base_url = "https://cube.tail99c274.ts.net:5000/v1"
vision_model = "gemma-4-31b-heretic-ara-q8-128k-cube"   # 4 slots sharing 128k; the 8k batch entry overflowed
chat_model = "qwen38-27b-heretic-uncensored-q8-cube"
vision_concurrency = "auto"   # or a number; "auto" reads the router's slots and context
vision_max_tokens = 3000        # v2 captions often ran past 1,600 and were redone at the end
vision_max_tokens_tall = 6000   # tall images and captions that still ran out, one request at a time
vision_max_side = 1024
vision_max_tiles = 6

[embed]
# Served on this machine by scripts/start_embed_server.sh (re2 serve and re2 embed start it), so search
# works when cube is down. Queries must use the model and build the index was made with.
url = "http://127.0.0.1:5010/v1/embeddings"
model = "nomic-embed-text-v1.5"
dims = 768
max_chars = 2000

[asr]
# Parakeet TDT 0.6B v3 (NeMo), run by re2/asr_worker.py in its own env: scripts/setup_asr_env.sh.
model = "nvidia/parakeet-tdt-0.6b-v3"
python = "~/ML/micromamba/envs/parakeet/bin/python"
device = "cuda"     # cuda (the card with the most free memory), cuda:N, or cpu
chunk_s = 120       # audio per pass; VRAM grows with it (120 s: ~2.7 GB for the whole process on a V100)
need_gb = 4.5       # free on a card before the model loads: the ~2.7 GB peak plus room for the router
floor_gb = 1.0      # stop after the current video once the card has less than this free

[server]
host = "127.0.0.1"
port = 4001

[chat]
# The Ask agent. To use another llama.cpp server for a while (e.g. mlboy while cube
# is down), put a [chat] section in config.local.toml, which is git-ignored.
base_url = "https://cube.tail99c274.ts.net:5000/v1"
model = "qwen38-27b-heretic-uncensored-q8-cube"
context_tokens = 32000

# [wiki]
# The text model that writes item digests and wiki pages (digests.sh, wiki_build.sh). Without this
# section it uses the [chat] settings above (including a [chat] in config.local.toml). A model with a
# larger context reads more items per request. context_tokens is what one request may use.
# base_url = "https://cube.tail99c274.ts.net:5000/v1"
# model = "qwen38-27b-heretic-uncensored-q8-cube"
# context_tokens = 32000
# concurrency = 1
