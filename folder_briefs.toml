# What each folder of the archive collects, as the collector's purpose, not as fact.
# The vision model gets the brief for an item's top-level folder, which helps it see why the item
# was kept (saved_as) and which later events matter (later_context). Drafted 2026-09-15 from
# samples of each folder; correct anything that is wrong or too narrow. Briefs marked "(guess)"
# are for folders with few or no captions yet.

"." = "The collector's general feed: US politics and elections, Trump, Biden and Harris, free speech and censorship, media bias, big tech and Elon Musk, culture-war stories and viral political clips."

"race" = "Race relations from the collector's point of view: violent crime by or against Black people, white people and immigrants (especially interracial attacks, mugshots, and cases the collector sees as under-reported or misreported by the media), racial crime statistics, anti-white rhetoric, immigration and its local effects (e.g. Haitian migrants), Jews and antisemitism, and double standards in policing, courts and media."

"covid-19" = "The pandemic and vaccines, mostly from a sceptical angle: purported vaccine injuries and deaths, including 'died suddenly' cases (deaths or collapses of vaccinated people, athletes and celebrities, often saved soon after the death alongside their earlier pro-vaccine statements); official claims later contradicted; mandates, lockdowns and censorship of dissenting doctors; lab-leak and gain-of-function origin claims (Fauci, EcoHealth, Wuhan); and studies or data cited as evidence."

"voter fraud" = "Claims of election fraud and irregularities, mostly about the 2020 and 2024 US elections: voting machines, mail-in ballots, swing-state counts (Michigan, Pennsylvania, Georgia, Arizona), lawsuits and affidavits, non-citizen voting, big tech or media suppression of fraud claims, and accusations that Democrats deny elections they lose."

"161572883" = "A general collection of recent (2024-2025) political news and commentary without one theme: the second Trump administration, Elon Musk and X, disputes over media coverage, political violence and viral clips. (guess)"

